name: Generate SDK
# Schema chunks are staged from the supplied v2.3 OpenAPI document.

on:
  push:
    paths:
      - "openapi_schemas/**"
      - "fix_openapi.py"
      - "openapi-client-config.yaml"
      - ".github/workflows/generate.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openapi-python-client>=0.26,<0.27" pyyaml

      - name: Reassemble schema
        run: |
          mkdir -p openapi_schemas
          cat _schema_chunks/chunk*.json > openapi_schemas/veeam_one_rest_v2.3.json
          python -m json.tool openapi_schemas/veeam_one_rest_v2.3.json >/dev/null

      - name: Fix schema
        run: |
          python fix_openapi.py             openapi_schemas/veeam_one_rest_v2.3.json             openapi_schemas/veeam_one_rest_v2.3_fixed.json

      - name: Generate
        run: |
          mkdir -p veeam_one
          rm -rf veeam_one/v2_3
          openapi-python-client generate             --path openapi_schemas/veeam_one_rest_v2.3_fixed.json             --config openapi-client-config.yaml             --output-path veeam_one/v2_3             --overwrite

      - name: Remove generated metadata and temporary chunks
        run: |
          rm -f veeam_one/v2_3/README.md veeam_one/v2_3/pyproject.toml veeam_one/v2_3/.gitignore
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Generate Veeam ONE v2.3 client"
          git push
