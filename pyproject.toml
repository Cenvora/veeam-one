[build-system]
requires = ["setuptools>=65.5.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veeam-one"
dynamic = ["version"]
description = "Veeam ONE REST API wrapper for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jonah May", email = "jonah@mayfamily.me" },
]

dependencies = [
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov",
    "black",
    "ruff>=0.13,<0.14",
    "openapi-python-client>=0.26,<0.27",
]

[project.urls]
Homepage = "https://github.com/Cenvora/veeam-one"
Repository = "https://github.com/Cenvora/veeam-one"

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"
tag_regex = "^(?:v)?(?P<version>.*)$"

[tool.setuptools.packages.find]
include = ["veeam_one*"]
exclude = ["tests*"]
